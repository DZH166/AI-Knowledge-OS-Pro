name: CI

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  backend:
    name: Backend, migrations and V5 evaluation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app scripts
      - run: python -m ruff check backend/app backend/tests scripts
      - run: python -m pytest backend/tests -q
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - run: python scripts/verify_v5_migration.py --roundtrip
      - run: python scripts/evaluate_agentic_rag.py --mode demo --database-path .pytest_tmp/v5_evaluation.db --output .pytest_tmp/v5_evaluation_report.json
      - run: python scripts/check_v5_acceptance.py --report .pytest_tmp/v5_evaluation_report.json --json-output .pytest_tmp/v5_acceptance_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-evaluation-evidence
          path: |
            .pytest_tmp/v5_evaluation_report.json
            .pytest_tmp/v5_acceptance_gate.json
          if-no-files-found: error

  frontend:
    name: Frontend quality and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  browser-e2e:
    name: Live backend + Evidence Agent E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - run: python scripts/run_demo_e2e.py --strict --database-path .pytest_tmp/v5_ci_showcase_live_e2e.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-v5-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  quality-and-release:
    name: Repository integrity and V5 release safety
    needs: [backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: v5-evaluation-evidence
          path: .pytest_tmp
      - run: python scripts/check_encoding.py
      - run: python scripts/check_version.py
      - run: python scripts/check_secrets.py
      - run: python scripts/check_repo_clean.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_readme_assets.py
      - run: python scripts/check_frontend_smoke.py
      - run: python scripts/check_ui_performance_budget.py
      - run: python scripts/check_interaction_feedback.py
      - run: python scripts/check_request_cache.py
      - run: python scripts/check_e2e.py
      - run: python scripts/evaluate_providers.py --dry-run
      - run: python scripts/check_v5_acceptance.py --report .pytest_tmp/v5_evaluation_report.json
      - run: python scripts/release.py --version V5.2 --dry-run
      - run: python scripts/release.py --version V5.2
      - run: python scripts/check_release.py --version V5.2
      - uses: actions/upload-artifact@v4
        with:
          name: suzhi-evidence-os-v5.2
          path: |
            releases/AI-Knowledge-OS-Pro-V5.2-*.zip
            releases/AI-Knowledge-OS-Pro-V5.2-*.zip.sha256
          if-no-files-found: error
