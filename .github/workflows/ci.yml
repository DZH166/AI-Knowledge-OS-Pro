name: CI

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  backend:
    name: Backend / Python 3.12
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app scripts
      - run: python -m pytest
      - run: python scripts/seed_demo_data.py --database-path backend/data/demo_showcase.db --reset
      - run: python scripts/check_demo_ready.py --database-path backend/data/demo_showcase.db
      - run: python scripts/evaluate_rag.py --demo --database-path backend/data/demo_showcase.db
      - run: python scripts/check_full_regression.py --database-path backend/data/demo_showcase.db
      - run: python -m alembic upgrade head
      - run: python -m alembic current

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  live-e2e:
    name: Live demo E2E / Playwright
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/run_demo_e2e.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-demo-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  quality-and-release:
    name: Encoding, version and release safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_encoding.py
      - run: python scripts/check_version.py
      - run: python scripts/check_secrets.py
      - run: python scripts/check_repo_clean.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_readme_assets.py
      - run: python scripts/check_frontend_smoke.py
      - run: python scripts/check_e2e.py
      - run: python scripts/check_ci_artifacts.py --json-output .pytest_tmp/ci_artifacts_contract.json --markdown-output .pytest_tmp/ci_artifacts_contract.md
      - run: python scripts/check_ci_artifacts_report.py --report-json .pytest_tmp/ci_artifacts_contract.json --markdown .pytest_tmp/ci_artifacts_contract.md
      - run: python scripts/run_demo_e2e.py
      - run: python scripts/evaluate_providers.py --dry-run
      - run: python scripts/run_self_check.py --mode quick --output-dir .pytest_tmp --write-index --write-plan
      - run: python scripts/run_next_self_check.py --next-command-json .pytest_tmp/self_check_next_command.json --json-output .pytest_tmp/next_self_check.json --markdown-output .pytest_tmp/next_self_check.md
      - run: python scripts/check_next_self_check_report.py --report-json .pytest_tmp/next_self_check.json
      - run: python scripts/run_self_check_loop.py --mode quick --output-dir .pytest_tmp/self_check_loop --max-steps 1 --dry-run --json-output .pytest_tmp/self_check_loop.json --markdown-output .pytest_tmp/self_check_loop.md
      - run: python scripts/check_self_check_loop_report.py --loop-json .pytest_tmp/self_check_loop.json
      - run: python scripts/run_self_check.py --mode release --output-dir .pytest_tmp/self_check_release --write-index --write-plan
      - run: python scripts/run_self_check.py --mode release --output-dir .pytest_tmp/self_check_release --compare-latest --write-index --write-plan --fail-on-regression
      - run: python scripts/run_next_self_check.py --next-command-json .pytest_tmp/self_check_release/self_check_next_command.json --json-output .pytest_tmp/self_check_release/next_self_check_full_ready.json --markdown-output .pytest_tmp/self_check_release/next_self_check_full_ready.md
      - run: python scripts/check_next_self_check_report.py --report-json .pytest_tmp/self_check_release/next_self_check_full_ready.json
      - run: python scripts/check_github_actions.py --json-output .pytest_tmp/github_actions_status.json --markdown-output .pytest_tmp/github_actions_status.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/check_github_actions_report.py --report-json .pytest_tmp/github_actions_status.json --markdown .pytest_tmp/github_actions_status.md
      - run: python scripts/release.py --version V4.5 --dry-run
      - run: python scripts/release.py --version V4.5
      - run: python scripts/check_release.py --version V4.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-json
          path: |
            .pytest_tmp/check_all_*.json
            .pytest_tmp/check_all_*.md
            .pytest_tmp/self_check_index.json
            .pytest_tmp/self_check_index.md
            .pytest_tmp/self_check_improvement_plan.json
            .pytest_tmp/self_check_improvement_plan.md
            .pytest_tmp/self_check_next_command.json
            .pytest_tmp/self_check_next_command.md
            .pytest_tmp/next_self_check.json
            .pytest_tmp/next_self_check.md
            .pytest_tmp/self_check_loop.json
            .pytest_tmp/self_check_loop.md
            .pytest_tmp/self_check_loop/next_self_check_step_*.json
            .pytest_tmp/self_check_loop/next_self_check_step_*.md
            .pytest_tmp/self_check_manifest.json
            .pytest_tmp/self_check_manifest.md
            .pytest_tmp/self_check_release/check_all_*.json
            .pytest_tmp/self_check_release/check_all_*.md
            .pytest_tmp/self_check_release/self_check_index.json
            .pytest_tmp/self_check_release/self_check_index.md
            .pytest_tmp/self_check_release/self_check_improvement_plan.json
            .pytest_tmp/self_check_release/self_check_improvement_plan.md
            .pytest_tmp/self_check_release/self_check_next_command.json
            .pytest_tmp/self_check_release/self_check_next_command.md
            .pytest_tmp/self_check_release/next_self_check_full_ready.json
            .pytest_tmp/self_check_release/next_self_check_full_ready.md
            .pytest_tmp/self_check_release/self_check_manifest.json
            .pytest_tmp/self_check_release/self_check_manifest.md
            .pytest_tmp/github_actions_status.json
            .pytest_tmp/github_actions_status.md
            .pytest_tmp/ci_artifacts_contract.json
            .pytest_tmp/ci_artifacts_contract.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Knowledge-OS-Pro-V4.5
          path: |
            releases/AI-Knowledge-OS-Pro-V4.5-*.zip
            releases/AI-Knowledge-OS-Pro-V4.5-*.zip.sha256
          if-no-files-found: error
