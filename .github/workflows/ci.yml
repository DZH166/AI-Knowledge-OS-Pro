name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python 3.12
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app scripts
      - run: python -m pytest
      - run: python scripts/seed_demo_data.py --database-path backend/data/demo_showcase.db --reset
      - run: python scripts/check_demo_ready.py --database-path backend/data/demo_showcase.db
      - run: python scripts/evaluate_rag.py --demo --database-path backend/data/demo_showcase.db
      - run: python scripts/check_full_regression.py --database-path backend/data/demo_showcase.db
      - run: python -m alembic upgrade head
      - run: python -m alembic current

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  quality-and-release:
    name: Encoding, version and release safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_encoding.py
      - run: python scripts/check_version.py
      - run: python scripts/check_secrets.py
      - run: python scripts/check_repo_clean.py
      - run: python scripts/check_docs_links.py
      - run: python scripts/check_readme_assets.py
      - run: python scripts/check_frontend_smoke.py
      - run: python scripts/check_all.py --quick
      - run: python scripts/release.py --version V4.3 --dry-run
      - run: python scripts/release.py --version V4.3
      - run: python scripts/check_release.py --version V4.3
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Knowledge-OS-Pro-V4.3
          path: |
            releases/AI-Knowledge-OS-Pro-V4.3-*.zip
            releases/AI-Knowledge-OS-Pro-V4.3-*.zip.sha256
          if-no-files-found: error
