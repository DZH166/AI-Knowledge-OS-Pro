name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python 3.12
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app backend/alembic scripts
      - run: python -m pytest
      - run: python -m alembic upgrade head
      - run: python -m alembic current

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  quality-and-release:
    name: Encoding, version and release safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_encoding.py
      - run: python scripts/check_version.py
      - run: python scripts/release.py --version V3.6
      - run: python scripts/check_release.py --version V3.6
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Knowledge-OS-Pro-V3.6
          path: |
            releases/AI-Knowledge-OS-Pro-V3.6-*.zip
            releases/AI-Knowledge-OS-Pro-V3.6-*.zip.sha256
          if-no-files-found: error
